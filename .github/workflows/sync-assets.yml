name: Sync shared assets to development

on:
  push:
    branches:
      - main
    paths:
      - "css/**"
      - "media/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Copy assets from main
        run: |
          git fetch origin main
          git restore --source origin/main -- css media

      - name: Commit updated assets
        run: |
          if git diff --quiet -- css media; then
            echo "Assets are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css media
          git commit -m "Sync CSS and media from main"
          git push origin HEAD:development
