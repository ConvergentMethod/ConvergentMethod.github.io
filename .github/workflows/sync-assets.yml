name: Sync shared assets to development

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "css/**"
      - "media/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out development branch
        uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - name: Copy assets from main
        run: |
          git fetch origin main
          test -n "$(git ls-tree -r --name-only origin/main -- css media)" || {
            echo "No css or media files were found on main."
            exit 1
          }
          git checkout origin/main -- css media

      - name: Commit updated assets
        run: |
          git add -A -- css media

          if git diff --cached --quiet -- css media; then
            echo "Assets are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync CSS and media from main"
          git push origin HEAD:development
