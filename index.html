<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Under Development | Convergent Method</title>
    <link rel="icon" type="image/png" href="media/favicon.webp">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .development-page {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--primary);
        }

        .development-page::before,
        .development-page::after {
            content: "";
            position: fixed;
            inset: -45%;
            z-index: -1;
            pointer-events: none;
            background-repeat: no-repeat;
            background-blend-mode: screen, soft-light, normal;
            filter: blur(48px) saturate(1.08);
            transform-origin: center;
            will-change: transform, background-position;
        }

        .development-page::before {
            background-image: radial-gradient(
                    ellipse at 18% 22%,
                    var(--accent) 0%,
                    transparent 56%
                ),
                radial-gradient(
                    ellipse at 76% 72%,
                    var(--gold) 0%,
                    transparent 54%
                ),
                conic-gradient(
                    from 210deg at 52% 48%,
                    var(--primary),
                    var(--accent),
                    var(--gold),
                    var(--primary),
                    var(--bkgd)
                ),
                radial-gradient(
                    ellipse at 50% 50%,
                    var(--primary) 0%,
                    var(--bkgd) 68%
                );
            animation: development-fluid-blue 24s ease-in-out infinite alternate;
        }

        .development-page::after {
            opacity: 0.72;
            background-image: radial-gradient(
                    ellipse at 74% 20%,
                    var(--yellow) 0%,
                    transparent 48%
                ),
                radial-gradient(
                    ellipse at 24% 76%,
                    var(--accent) 0%,
                    transparent 52%
                ),
                conic-gradient(
                    from 30deg at 48% 54%,
                    transparent,
                    var(--yellow),
                    var(--accent),
                    transparent 72%
                ),
                radial-gradient(
                    ellipse at 50% 50%,
                    transparent 26%,
                    var(--primary) 82%
                );
            animation: development-fluid-gold 30s ease-in-out infinite alternate;
        }

        @keyframes development-fluid-blue {
            from {
                background-position: 12% 18%, 82% 72%, 50% 50%, 50% 50%;
                transform: translate3d(-3%, -2%, 0) rotate(-8deg) scale(1.02);
            }
            to {
                background-position: 34% 44%, 62% 56%, 50% 50%, 50% 50%;
                transform: translate3d(4%, 3%, 0) rotate(8deg) scale(1.14);
            }
        }

        @keyframes development-fluid-gold {
            from {
                background-position: 74% 18%, 24% 82%, 50% 50%, 50% 50%;
                transform: translate3d(4%, 3%, 0) rotate(8deg) scale(1.08);
            }
            to {
                background-position: 56% 36%, 44% 62%, 50% 50%, 50% 50%;
                transform: translate3d(-4%, -4%, 0) rotate(-8deg) scale(1.2);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .development-page::before,
            .development-page::after {
                animation: none;
            }
        }

        .development-header {
            position: relative;
            z-index: 1;
            background: rgba(12, 43, 73, 0.85);
            border-bottom: 1px solid rgba(254, 195, 101, 0.25);
            padding: 1rem 20px;
        }

        .development-header .logo {
            max-width: 1200px;
            margin: 0 auto;
        }

        .development-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(3rem, 8vw, 7rem) 20px;
            text-align: center;
        }

        .development-panel {
            width: min(100%, 720px);
            padding: clamp(2rem, 6vw, 4rem);
            background: rgba(26, 37, 47, 0.48);
            border: 1px solid rgba(236, 240, 241, 0.18);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
        }

        .development-label {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 6px 16px;
            border: 1px solid rgba(254, 195, 101, 0.45);
            border-radius: 20px;
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .development-panel h1 {
            margin-bottom: 1.25rem;
            color: var(--light);
        }

        .development-panel h1 span {
            color: var(--gold);
        }

        .development-panel p {
            max-width: 560px;
            margin: 0 auto;
            color: var(--text);
            font-size: 1.1rem;
        }

        .development-panel .linkedin-btn {
            width: fit-content;
            max-width: none;
            margin-top: 1.5rem;
            padding: 8px 14px;
            gap: 8px;
            font-size: 0.9rem;
        }

        .development-footer {
            position: relative;
            z-index: 1;
            padding: 1.5rem 20px;
            border-top: 1px solid rgba(236, 240, 241, 0.12);
            color: rgba(238, 238, 238, 0.7);
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="development-page">
    <header class="development-header">
        <a href="index.html" class="logo" aria-label="Convergent Method home">
            <img src="media/CMFullWhite.png" alt="Convergent Method logo">
            Convergent Method
        </a>
    </header>

    <main class="development-content">
        <section class="development-panel" aria-labelledby="development-title">
            <div class="development-label">Website in development</div>

            <h1 id="development-title">
                Convergent Method is <span>building</span> something new.
            </h1>

            <p>
                Our website is currently being updated. Please check back soon
                to learn more about our work in engineering, construction, and
                healthcare.
            </p>

            <a
                class="linkedin-btn"
                href="https://www.linkedin.com/company/convergent-method-llc/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit Convergent Method on LinkedIn"
            >
                <img src="media/linkedin.png" alt="">
            </a>
        </section>
    </main>

    <footer class="development-footer">
        <p>&copy; 2026 Convergent Method LLC. All Rights Reserved.</p>
    </footer>
</body>
</html>
