<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Under Development | Convergent Method</title>
    <link rel="icon" type="image/png" href="media/favicon.webp">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .development-page {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bkgd);
        }

        .development-page::before,
        .development-page::after {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -1;
            pointer-events: none;
            background-size: 350% 350%;
        }

        .development-page::before {
            background-image: linear-gradient(
                115deg,
                var(--bkgd) 0%,
                var(--primary) 23%,
                var(--accent) 43%,
                var(--bkgd) 63%,
                rgba(254, 195, 101, 0.42) 76%,
                var(--bkgd) 100%
            );
            animation: development-gradient-wave 18s ease-in-out infinite alternate;
        }

        .development-page::after {
            opacity: 0.3;
            background-image: repeating-linear-gradient(
                115deg,
                transparent 0%,
                transparent 18%,
                rgba(236, 240, 241, 0.16) 24%,
                transparent 31%,
                transparent 48%
            );
            animation: development-gradient-shimmer 26s linear infinite;
        }

        @keyframes development-gradient-wave {
            from {
                background-position: 0% 50%;
                transform: rotate(-2deg) scale(1.05);
            }
            to {
                background-position: 100% 50%;
                transform: rotate(2deg) scale(1.15);
            }
        }

        @keyframes development-gradient-shimmer {
            from {
                background-position: 0% 50%;
                transform: translateX(-8%) rotate(-2deg);
            }
            to {
                background-position: 100% 50%;
                transform: translateX(8%) rotate(2deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .development-page::before,
            .development-page::after {
                animation: none;
            }
        }

        .development-header {
            position: relative;
            z-index: 1;
            background: rgba(12, 43, 73, 0.85);
            border-bottom: 1px solid rgba(254, 195, 101, 0.25);
            padding: 1rem 20px;
        }

        .development-header .logo {
            max-width: 1200px;
            margin: 0 auto;
        }

        .development-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(3rem, 8vw, 7rem) 20px;
            text-align: center;
        }

        .development-panel {
            width: min(100%, 720px);
            padding: clamp(2rem, 6vw, 4rem);
            background: rgba(26, 37, 47, 0.48);
            border: 1px solid rgba(236, 240, 241, 0.18);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
        }

        .development-label {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 6px 16px;
            border: 1px solid rgba(254, 195, 101, 0.45);
            border-radius: 20px;
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .development-panel h1 {
            margin-bottom: 1.25rem;
            color: var(--light);
        }

        .development-panel h1 span {
            color: var(--gold);
        }

        .development-panel p {
            max-width: 560px;
            margin: 0 auto;
            color: var(--text);
            font-size: 1.1rem;
        }

        .development-footer {
            position: relative;
            z-index: 1;
            padding: 1.5rem 20px;
            border-top: 1px solid rgba(236, 240, 241, 0.12);
            color: rgba(238, 238, 238, 0.7);
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="development-page">
    <header class="development-header">
        <a href="index.html" class="logo" aria-label="Convergent Method home">
            <img src="media/CMFullWhite.png" alt="Convergent Method logo">
            Convergent Method
        </a>
    </header>

    <main class="development-content">
        <section class="development-panel" aria-labelledby="development-title">
            <div class="development-label">Website in development</div>

            <h1 id="development-title">
                Convergent Method is <span>building</span> something new.
            </h1>

            <p>
                Our website is currently being updated. Please check back soon
                to learn more about our work in engineering, construction, and
                healthcare.
            </p>
        </section>
    </main>

    <footer class="development-footer">
        <p>&copy; 2026 Convergent Method LLC. All Rights Reserved.</p>
    </footer>
</body>
</html>
