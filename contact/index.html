<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0C2B49">
    <title>Contact | Convergent Method</title>
    <link rel="icon" type="image/png" href="../media/favicon.png">

    <!-- Google Fonts (Urbanist) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style.css?v=395">
</head>
<body class="contact-page-body">

    <!-- Global Navigation -->
    <header>
        <nav aria-label="Main Navigation">
            <a href="../index.html" class="logo">
                <img src="../media/CMFullWhite.png" alt="Convergent Method Logo" height="50">
                Convergent Method
            </a>
            <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation menu">
            <label for="menu-toggle" class="menu-button" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../team/index.html">Team</a>
                <a href="./" class="active" aria-current="page">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container contact-page">
        <div class="contact-header-block">
            <h1 class="page-title">Get in Touch</h1>
            <a href="https://www.linkedin.com/company/convergent-method" target="_blank" rel="noopener noreferrer" class="linkedin-btn">
                <img src="../media/linkedin.png" alt="LinkedIn Logo">
                Connect on LinkedIn
            </a>
        </div>

        <div class="contact-layout">
            <div class="contact-wrapper">
                <form action="https://formspree.io/f/xvkgovkv" method="POST">
                    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" hidden>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn" style="width:100%">Send Message</button>
                </form>
            </div>
            <aside class="column contact-note">
                <h3>Start a conversation</h3>
                <p>Tell us what you are planning. We bring owners, contractors, engineers, and key stakeholders together to drive complex projects forward.</p>
            </aside>
        </div>
    </main>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p class="footer-copyright">
                    &copy; 2026 Convergent Method LLC. All Rights Reserved.
                </p>
            </div>
            <div class="footer-right">
                <img src="../media/CMFullColor.png" alt="Convergent Method Logo" class="footer-logo">
            </div>
        </div>
    </footer>

</body>
</html>
